name: build

on:
  push:
    branches: [main]
    paths: [Dockerfile, "patches/**", .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ZEROCLAW_REF: v0.9.0
  # Bump when the patch set changes; the image tag is <ref>-<patchset>.
  PATCHSET: pr12479

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The Rust release build needs more disk than the runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ZEROCLAW_REF=${{ env.ZEROCLAW_REF }}
            ZEROCLAW_IMAGE=ghcr.io/zeroclaw-labs/zeroclaw:${{ env.ZEROCLAW_REF }}-debian
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.ZEROCLAW_REF }}-${{ env.PATCHSET }}
            ${{ steps.img.outputs.name }}:${{ env.ZEROCLAW_REF }}-${{ env.PATCHSET }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ZeroClaw ${{ env.ZEROCLAW_REF }} with unreleased upstream fixes (${{ env.PATCHSET }})
